
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <title>Colorful Calculator</title>

</head>

<body class="min-h-screen bg-[#fceee9] flex justify-center items-center">
    <div class="w-[330px] bg-[#fceee9] p-4">
        <div class="bg-[#efb2bb]">
            <div class="h-[215px] p-6 flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <h1 class="text-[#df6672] text-xl font-bold">
                        CALCI
                    </h1>
                    <button class="text-[#df6672] text-2xl leading-none">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                </div>
                <div class="text-right">
                    <span class="text-[#df6672] text-4xl font-medium">
                        9462
                    </span>
                </div>
            </div>
            <div class="bg-[#df707d]  py-8">
      
                <div class="grid grid-cols-4 gap-y-12 text-center">
                    <button class="text-white text-2xl font-light">
                        C
                    </button>
                    <button class="text-white text-2xl font-light">
                        %
                    </button>
                    <button class="text-white text-2xl font-light">
                        /
                    </button>
                    <button class="text-white text-2xl font-light">
                        x
                    </button>
          
                    <button class="text-white text-2xl font-light">
                        7
                    </button>
                    <button class="text-white text-2xl font-light">
                        8
                    </button>
                    <button class="text-white text-2xl font-light">
                        9
                    </button>
                    <button class="text-white text-2xl font-light">
                        -
                    </button>
                    <button class="text-white text-2xl font-light">
                        4
                    </button>
                    <button class="text-white text-2xl font-light">
                        5
                    </button>
                    <button class="text-white text-2xl font-light">
                        6
                    </button>
                    <button class="text-white text-2xl font-light">
                        +
                    </button>
                    <button class="text-white text-2xl font-light">
                        1
                    </button>
                    <button class="text-white text-2xl font-light">
                        2
                    </button>
                    <button class="text-white text-2xl font-light">
                        3
                    </button>
                    <button class="text-white text-2xl font-light row-span-2 flex items-center justify-center">
                        =
                    </button>
                    <button class="text-white text-2xl font-light">
                        0
                    </button>
                    <button class="text-white text-2xl font-light">
                        .
                    </button>
                    <button class="text-white text-2xl font-light">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
